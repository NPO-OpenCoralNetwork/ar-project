# Netlify の設定。妖怪ゲームの試作（apps/yokai-game。Vite の複数ページ）をビルドして公開する。
# 夢の旅 = /、現の旅 = /utsutsu.html、GPS の検証 = /gps-test.html。位置情報・カメラを使うので https で配る（Netlify は既定で https）。
[build]
  base = "apps/yokai-game"
  command = "npm run build"
  # base からの相対パス
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
