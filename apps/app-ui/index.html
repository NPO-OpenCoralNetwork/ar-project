<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アプリ画面の見本</title>
<meta name="description" content="ゆめうつつ（仮）のアプリ画面の見本。PO と方向を合わせるためのもので、公開しない。店名・数・灯り・噂の地はすべて例。">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600&display=swap">
<style>
/* ===== 色と文字（01 §5。06「光と霞」と hud.ts の和紙・墨） ===== */
:root {
  color-scheme: light;
  --title-font: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --ui-font: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  --bg: #f1ebdf;
  --bg-grad: radial-gradient(1200px 600px at 70% -10%, #f6dfa6 0%, rgba(246,223,166,0) 60%), linear-gradient(180deg, #f4ecd9 0%, #f1ebdf 40%, #ece4d3 100%);
  --surface: #faf7f0;
  --surface-2: #f3eee3;
  --surface-3: #ebe4d4;
  --ink: #2a2622;
  --ink-soft: rgba(42,38,34,0.70);
  --line: rgba(42,38,34,0.22);
  --line-strong: rgba(42,38,34,0.38);
  --ai: #3f5f8f;
  --ai-on: #ffffff;
  --ai-text: #3f5f8f;
  --ai-wash: rgba(63,95,143,0.10);
  --akane: #b5523b;
  --gold: #9a7421;
  --gold-line: #c9a24a;
  --amber: #ffd89a;
  --amber-ring: #ff9a48;
  --paper: #fbf8f0;
  --paper-ring: #fff1d6;
  --shadow: 0 1px 2px rgba(42,38,34,0.06), 0 10px 30px rgba(42,38,34,0.10);
  --device-edge: #2a2622;
  --map-bg: #f4e2b8;
  --map-block: #e2d0a6;
  --map-road: #ecdcb8;
  --map-road-edge: #dcae74;
  --map-water: #63b8b4;
  --map-green: #9cba78;
  --map-haze: rgba(246,223,166,.9);
  --map-rail: #6b6460;
  --ink-line: #2a2622;
  --rei-bg: #fff1d6;
  --rei-ink: #7a4a12;
  --chart-grid: rgba(42,38,34,0.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0a0f22;
    --bg-grad: radial-gradient(900px 500px at 75% -10%, rgba(74,34,48,0.55) 0%, rgba(74,34,48,0) 60%), linear-gradient(180deg, #070b1d 0%, #0f1633 50%, #121a3a 100%);
    --surface: #161c38;
    --surface-2: #1d2548;
    --surface-3: #252d55;
    --ink: #e6e2ef;
    --ink-soft: rgba(216,212,228,0.74);
    --line: rgba(216,212,228,0.22);
    --line-strong: rgba(216,212,228,0.38);
    --ai: #4d6ea3;
    --ai-on: #ffffff;
    --ai-text: #a9bfe3;
    --ai-wash: rgba(120,150,210,0.14);
    --akane: #e3907e;
    --gold: #e2bd6a;
    --gold-line: #d8ae55;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.35);
    --device-edge: #000000;
    --map-bg: #1d2548;
    --map-block: #222b52;
    --map-road: #56607e;
    --map-road-edge: #3e4868;
    --map-water: #1c3054;
    --map-green: #24364a;
    --map-haze: rgba(15,22,51,.9);
    --map-rail: #8e8aa6;
    --ink-line: #e6e2ef;
    --rei-bg: rgba(255,216,154,0.16);
    --rei-ink: #ffd89a;
    --chart-grid: rgba(216,212,228,0.14);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0f22;
  --bg-grad: radial-gradient(900px 500px at 75% -10%, rgba(74,34,48,0.55) 0%, rgba(74,34,48,0) 60%), linear-gradient(180deg, #070b1d 0%, #0f1633 50%, #121a3a 100%);
  --surface: #161c38;
  --surface-2: #1d2548;
  --surface-3: #252d55;
  --ink: #e6e2ef;
  --ink-soft: rgba(216,212,228,0.74);
  --line: rgba(216,212,228,0.22);
  --line-strong: rgba(216,212,228,0.38);
  --ai: #4d6ea3;
  --ai-on: #ffffff;
  --ai-text: #a9bfe3;
  --ai-wash: rgba(120,150,210,0.14);
  --akane: #e3907e;
  --gold: #e2bd6a;
  --gold-line: #d8ae55;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.35);
  --device-edge: #000000;
  --map-bg: #1d2548;
  --map-block: #222b52;
  --map-road: #56607e;
  --map-road-edge: #3e4868;
  --map-water: #1c3054;
  --map-green: #24364a;
  --map-haze: rgba(15,22,51,.9);
  --map-rail: #8e8aa6;
  --ink-line: #e6e2ef;
  --rei-bg: rgba(255,216,154,0.16);
  --rei-ink: #ffd89a;
  --chart-grid: rgba(216,212,228,0.14);
}

/* 絵の時間帯（06 §2.1〜2.3）。テーマとは別に切り替える */
.art { --s1:#86bfd6; --s2:#cfe2d4; --s3:#f4e2b8; --haze:#f6dfa6; --glow:#ffe6a0; --m1:#b9cbd6; --m1e:#9fb9ca; --m2:#a7c2c0; --m3:#9cb894; --snow:#fbf6ea;
  --field:#d6c47f; --field2:#cdbb74; --grass:#9cba78; --path:#dcae74; --water:#63b8b4; --wood:#6f9a6a; --cedar:#5b8a68; --broad:#8fb26a; --roof:#6a7392; --wall:#e4d4bc; --cloud:#fffaf0; --fog:#ffffff; --fogglow:#ffffff; --win:transparent;
  --hud-bg: rgba(250,247,240,0.88); --hud-ink:#2a2622; --hud-soft: rgba(42,38,34,0.70); --hud-line: rgba(42,38,34,0.22); --dot:#ffe7a8;
  --rim1:#9fb9ca; --rim2:#8fb0ad; --rim3:#84a67e; --rimw:1;
  --meet-scrim: linear-gradient(180deg, rgba(246,223,166,.25), rgba(250,247,240,.55)); --meet-glow: rgba(255,241,214,.22);
  --em-land:#f1e6cc; --em-plain:#eadaa9; --em-sea:#a6d0cf; --em-sea-line:#78aeab; --em-river:#86c0c2; --em-m1:#c3c6dc; --em-m2:#a9bccb; --em-m3:#9fbc95; --em-snow:#fdf9ef; --em-haze:#faf3e2; --em-field:#dcc785; --em-hill:#b5cc8e; --em-tree:#6f9a6a; --em-house:#8a8fa8; --em-line:rgba(42,38,34,0.32); }
.art[data-time="dusk"] { --s1:#3b3d78; --s2:#9a86b0; --s3:#eaa6a2; --haze:#eeae96; --glow:#ffb08a; --m1:#8e84aa; --m1e:#d99c9c; --m2:#7a7598; --m3:#626686; --snow:#f4c2b8;
  --field:#d8ae8c; --field2:#cfa486; --grass:#a09a8c; --path:#d49c86; --water:#9a9cc8; --wood:#6a6e80; --cedar:#566878; --broad:#7a8a7a; --roof:#585a80; --wall:#e6c4b6; --cloud:#f4c0a2; --fog:#f3dde0; --fogglow:#f3dde0; --win:#f2b866; --dot:#ffc79a;
  --rim1:#d99c9c; --rim2:#8f84a6; --rim3:#6c6e8e; --rimw:1.2;
  --em-land:#e6c9b4; --em-plain:#dcb9a4; --em-sea:#9a9cc8; --em-sea-line:#7a7cb0; --em-river:#a6a2d0; --em-m1:#8e84aa; --em-m2:#7a7598; --em-m3:#626686; --em-snow:#f4c2b8; --em-haze:#f3dde0; --em-field:#d8ae8c; --em-hill:#a09a8c; --em-tree:#566878; --em-house:#585a80; --em-line:rgba(42,38,34,0.3); }
.art[data-time="night"] { --s1:#070b1d; --s2:#0f1633; --s3:#1d2548; --haze:#161d3a; --glow:#4a2230; --m1:#1c2244; --m1e:#8a4a58; --m2:#161c38; --m3:#10162c; --snow:#3c4466;
  --field:#34416a; --field2:#303c64; --grass:#2f4d5e; --path:#66708e; --water:#1c3054; --wood:#1c2c3c; --cedar:#1e3242; --broad:#2a3e4a; --roof:#1e2340; --wall:#4a5272; --cloud:#4a3a5c; --fog:#4a3c5e; --fogglow:#e89a52; --win:#f2b866;
  --hud-bg: rgba(16,20,40,0.74); --hud-ink:#e6e2ef; --hud-soft: rgba(216,212,228,0.78); --hud-line: rgba(216,212,228,0.24); --dot:#cfe6ff;
  --rim1:rgba(138,74,88,.5); --rim2:#8a4a58; --rim3:#181c32; --rimw:1.5;
  --meet-scrim: linear-gradient(180deg, rgba(7,11,29,.35), rgba(7,11,29,.72)); --meet-glow: rgba(255,216,154,.16);
  --em-land:#1a2246; --em-plain:#212c55; --em-sea:#142648; --em-sea-line:#2c4a74; --em-river:#34588a; --em-m1:#3d4474; --em-m2:#303864; --em-m3:#263254; --em-snow:#9aa0c4; --em-haze:#252c54; --em-field:#2c3862; --em-hill:#1d3040; --em-tree:#16283a; --em-house:#e8b05e; --em-line:rgba(216,212,228,0.28); }
/* 光蔵坊（サイトと同じ線画）。夢＝白描、現＝色。夜の白描は線を明るくして塗らない */
.kl { fill: none; stroke: var(--k-ink); stroke-linecap: round; stroke-linejoin: round; }
.k-yume { --k-paper: #fbf8f0; --k-ink: #2a2622; }
.art[data-time="night"] .k-yume, .k-yume.on-night { --k-paper: none; --k-ink: #e9e5f2; }
.k-utsu { --k-paper: #efe6d6; --k-ink: rgba(42,38,34,.8); --k-wing: #8a6a58; --k-hair: #3a3a48; --k-skin: #e8cfb0; --k-robe: #efe6d6; --k-hakama: #6a7392; --k-pom: #b5523b; --k-fan: #7f8f5c; --k-tokin: #3a3430; --k-geta: #8a5a44; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); background-image: var(--bg-grad); background-attachment: fixed;
  color: var(--ink); font-family: var(--ui-font); font-size: 15px; line-height: 1.7;
  -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden;
}
button { font: inherit; color: inherit; }
a { color: var(--ai-text); }
:focus-visible { outline: 2px solid var(--ai-text); outline-offset: 2px; }

/* ===== 外側（見本の説明の部分） ===== */
.page-head { max-width: 1280px; margin: 0 auto; padding: 12px 24px 4px; display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.page-head h1 { font-family: var(--title-font); font-weight: 600; font-size: 22px; letter-spacing: 0.06em; margin: 0; line-height: 1.4; }
.page-head p { margin: 2px 0 0; color: var(--ink-soft); font-size: 12.5px; max-width: 820px; line-height: 1.6; }
.mock-flag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); margin-left: 8px; vertical-align: 3px; font-family: var(--ui-font); letter-spacing: 0; font-weight: 500; }
.theme-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px; gap: 2px; }
.theme-switch button { border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; min-height: 36px; cursor: pointer; font-size: 13px; color: var(--ink-soft); }
.theme-switch button[aria-pressed="true"] { background: var(--ai); color: var(--ai-on); }

.layout { max-width: 1280px; margin: 0 auto; padding: 8px 24px 40px; display: grid; grid-template-columns: 250px minmax(0,1fr) 300px; gap: 24px; align-items: start; }
.flow { position: sticky; top: 12px; }
.flow h2, .notes h2 { font-family: var(--title-font); font-size: 15px; font-weight: 600; letter-spacing: 0.08em; margin: 0 0 8px; }
.flow ol { list-style: none; margin: 0; padding: 0; position: relative; }
.flow ol::before { content: ""; position: absolute; left: 15px; top: 14px; bottom: 14px; width: 1px; background: var(--line-strong); }
.flow li { position: relative; }
.flow .grp { font-size: 11.5px; color: var(--ink-soft); padding: 10px 0 2px 38px; letter-spacing: 0.06em; }
.flow button { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; padding: 5px 6px 5px 0; cursor: pointer; border-radius: 10px; min-height: 36px; }
.flow button .n { flex: none; width: 31px; height: 26px; border-radius: 13px; display: grid; place-items: center; font-size: 11.5px; background: var(--surface); border: 1px solid var(--line-strong); position: relative; z-index: 1; color: var(--ink-soft); }
.flow button .t { font-size: 13.5px; line-height: 1.35; }
.flow button .t small { display: block; color: var(--ink-soft); font-size: 11px; }
.flow button:hover .t { color: var(--ai-text); }
.flow button[aria-current="true"] .n { background: var(--ai); color: var(--ai-on); border-color: var(--ai); }
.flow button[aria-current="true"] .t { font-weight: 700; }

.stage { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
.side { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.controls { width: 100%; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow); }
.controls .ctl-title { width: 100%; font-size: 11.5px; letter-spacing: .08em; color: var(--ink-soft); }
.device-fit { position: relative; width: 390px; display: flex; justify-content: center; }
.device-fit.wide { width: min(100%, 720px); }
.controls .lbl { color: var(--ink-soft); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 4px 10px; min-height: 32px; cursor: pointer; font-size: 12.5px; color: var(--ink-soft); }
.seg button[aria-pressed="true"] { background: var(--ai-wash); color: var(--ai-text); font-weight: 700; box-shadow: inset 0 0 0 1px var(--ai-text); }
.ctl-btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 4px 12px; min-height: 34px; cursor: pointer; font-size: 12.5px; }
.ctl-btn:hover { border-color: var(--ai-text); color: var(--ai-text); }

.device {
  position: relative; width: 390px; height: 780px; border-radius: 40px; overflow: hidden;
  border: 10px solid var(--device-edge); box-shadow: var(--shadow); background: var(--surface);
  --fs: 1; font-size: calc(15px * var(--fs)); transition: width .4s ease;
}
.device.wide { width: min(100%, 720px); height: 740px; border-radius: 14px; border-width: 1px; border-color: var(--line-strong); }
.device.wide::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 30px; background: var(--surface-3); border-bottom: 1px solid var(--line); z-index: 5; }
.device.wide::after { content: "● ● ●"; position: absolute; top: 5px; left: 12px; font-size: 10px; letter-spacing: 3px; color: var(--ink-soft); z-index: 6; }
.screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; animation: haze-in .5s ease; }
.device.wide .screen { top: 30px; }
@keyframes haze-in { from { opacity: 0; filter: blur(4px); } to { opacity: 1; filter: none; } }

.notes { overflow-wrap: anywhere; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 12px; box-shadow: var(--shadow); font-size: 13.5px; }
.notes .id { font-size: 11.5px; color: var(--ink-soft); letter-spacing: 0.06em; }
.notes h2 { font-size: 18px; margin: 2px 0 8px; }
.notes h3 { font-size: 12.5px; color: var(--ink-soft); font-weight: 700; margin: 12px 0 4px; letter-spacing: 0.06em; }
.notes p { margin: 0 0 6px; }
.notes ul { margin: 0; padding-left: 1.2em; }
.notes li { margin: 2px 0; }
.notes .navrow { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }
.notes .navrow button { border: 1px solid var(--line-strong); background: var(--surface-2); border-radius: 10px; min-height: 40px; padding: 4px 12px; cursor: pointer; font-size: 13px; max-width: 48%; }
.notes .navrow button:disabled { opacity: .4; cursor: default; }
.mobile-pick { display: none; }

@media (max-width: 1120px) {
  .layout { grid-template-columns: minmax(0,1fr) 300px; }
  .flow { display: none; }
  .mobile-pick { display: flex; }
}
@media (max-width: 760px) {
  .page-head { padding: 14px 16px 6px; }
  .page-head h1 { font-size: 19px; }
  .layout { grid-template-columns: minmax(0,1fr); padding: 6px 16px 32px; gap: 14px; }
  .side { position: static; }
  .device-fit, .device-fit.wide { width: calc(100% + 32px); margin: 0 -16px; }
  .device { width: 100%; margin: 0; height: 760px; border-radius: 0; border-width: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); box-shadow: none; }
  .device.wide { width: 100%; height: 760px; border-radius: 0; }
}
.mobile-pick { width: 100%; max-width: 700px; gap: 8px; align-items: center; }
.mobile-pick select { flex: 1; min-width: 0; min-height: 40px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 0 10px; font: inherit; font-size: 14px; }
.mobile-pick button { min-height: 40px; min-width: 44px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; }

/* ===== アプリの中の部品 ===== */
.rei { display: inline-block; font-family: var(--ui-font); font-size: max(11px, 0.78em); font-weight: 700; line-height: 1.5; padding: 1px 0.45em; border-radius: 4px; background: var(--rei-bg); color: var(--rei-ink); border: 1px solid currentColor; vertical-align: 0.12em; margin-left: 0.3em; letter-spacing: 0; white-space: nowrap; }
.sosaku { font-size: max(11px, 0.78em); color: var(--ink-soft); border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 0.4em; margin-left: 0.4em; white-space: nowrap; font-family: var(--ui-font); }
.kyoryoku { display: inline-block; font-size: 0.75em; font-weight: 700; color: var(--ai-text); border: 1px solid var(--ai-text); border-radius: 6px; padding: 0 0.5em; letter-spacing: 0.08em; background: transparent; }
.app { min-height: 100%; display: flex; flex-direction: column; background: var(--surface-2); }
.app-top { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.app-top h1 { font-family: var(--title-font); font-weight: 600; font-size: 1.05em; margin: 0; letter-spacing: 0.06em; flex: 1; min-width: 0; }
.back { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; min-height: 44px; min-width: 44px; padding: 0 12px; cursor: pointer; font-size: 0.9em; display: inline-flex; align-items: center; gap: 4px; }
.app-body { flex: 1; padding: 14px 14px 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
.card + .card { margin-top: 12px; }
.card h3 { font-family: var(--title-font); font-size: 1.02em; margin: 0 0 4px; font-weight: 600; letter-spacing: 0.04em; }
.muted { color: var(--ink-soft); }
.small { font-size: 0.86em; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-size: 1em; padding: 6px 14px; text-align: center; }
.btn.primary { background: var(--ai); color: var(--ai-on); border-color: var(--ai); font-weight: 700; }
.btn.ghost { background: transparent; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.55; cursor: default; }
.btn .sub { font-size: 0.8em; font-weight: 400; opacity: 0.9; }
.btn-col { display: flex; flex-direction: column; gap: 10px; }
.ico { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

/* 箱庭の HUD（01 §3.2） */
.scene { position: absolute; inset: 0; overflow: hidden; }
.scene > svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; color: var(--hud-ink); font-family: var(--ui-font); }
.hud > * { pointer-events: auto; }
.hud-chip { background: var(--hud-bg); color: var(--hud-ink); border: 1px solid var(--hud-line); border-radius: 12px; min-height: 44px; min-width: 44px; padding: 0 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.86em; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.hud-tl { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; align-items: center; }
.hud-tl .place { background: var(--hud-bg); border: 1px solid var(--hud-line); border-radius: 10px; padding: 3px 10px; font-family: var(--title-font); font-size: 0.8em; letter-spacing: 0.06em; }
.hud-tr { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; }
.hud-attr { position: absolute; right: 8px; bottom: 8px; font-size: 11px; line-height: 1.4; padding: 3px 7px; border-radius: 6px; background: var(--hud-bg); color: var(--hud-ink); max-width: 210px; text-align: right; }
.hud-stick { position: absolute; left: 22px; bottom: 34px; width: 92px; height: 92px; border-radius: 50%; border: 1.5px solid var(--hud-line); background: radial-gradient(circle, rgba(255,255,255,0.18) 0 22px, transparent 23px); pointer-events: none; }
.hud-stick::after { content: "ここを指で"; position: absolute; left: 0; right: 0; bottom: -18px; text-align: center; font-size: 11px; color: var(--hud-soft); }
.hud-attr.top { top: 64px; left: 12px; right: auto; bottom: auto; text-align: left; max-width: 230px; background: rgba(250,247,240,.7); color: #2a2622; }
.art[data-time="night"] .hud-attr.top { background: rgba(16,20,40,.62); color: #e6e2ef; }
.hud-attr a, .map-attr a { color: inherit; }
.listen { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); width: 108px; height: 108px; border-radius: 50%; border: 1px solid var(--hud-line); background: var(--hud-bg); color: var(--hud-ink); cursor: pointer; display: grid; place-items: center; text-align: center; font-family: var(--title-font); font-size: 0.95em; line-height: 1.3; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.listen small { display: block; font-family: var(--ui-font); font-size: 0.7em; color: var(--hud-soft); margin-top: 2px; }
.listen::before, .listen::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 1px solid var(--hud-line); animation: ripple 3.2s ease-out infinite; }
.listen::after { animation-delay: 1.6s; }
.listen.hold { background: conic-gradient(var(--ai) var(--p, 0%), var(--hud-bg) 0); color: var(--hud-ink); }
@keyframes ripple { from { transform: scale(0.9); opacity: 0.9; } to { transform: scale(1.35); opacity: 0; } }
.ring-menu { position: absolute; top: 62px; right: 12px; background: var(--hud-bg); border: 1px solid var(--hud-line); border-radius: 14px; padding: 6px; display: flex; flex-direction: column; gap: 4px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.ring-menu button { border: 0; background: transparent; color: var(--hud-ink); min-height: 44px; padding: 0 14px; text-align: left; border-radius: 10px; cursor: pointer; font-size: 0.9em; }
.ring-menu button:hover { background: rgba(127,127,127,0.14); }
.rest-hit { cursor: pointer; }
.rest-hit:focus-visible { outline: 2px solid #3f5f8f; }
.tap-ring { fill: none; stroke: #3f5f8f; stroke-width: 1.5; stroke-dasharray: 3 4; opacity: 0.0; }
.show-hints .tap-ring { opacity: 0.9; }

/* 札（シート） */
.sheet-wrap { position: absolute; inset: 0; z-index: 8; background: rgba(10,12,24,0.38); display: flex; align-items: flex-end; animation: fade .4s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet { width: 100%; background: var(--surface); color: var(--ink); border-radius: 18px 18px 0 0; border-top: 1px solid var(--line); padding: 10px 18px 20px; animation: rise .5s ease; max-height: 88%; overflow-y: auto; }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 0 auto 12px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 0.9em; margin: 10px 0; }
.kv dt { color: var(--ink-soft); }
.kv dd { margin: 0; }
.promise { list-style: none; padding: 0; margin: 10px 0; }
.promise li { padding: 8px 10px 8px 34px; position: relative; border-radius: 10px; background: var(--surface-2); margin-bottom: 6px; font-size: 0.93em; }
.promise li::before { content: ""; position: absolute; left: 12px; top: 50%; width: 12px; height: 6px; border-left: 2px solid var(--ai-text); border-bottom: 2px solid var(--ai-text); transform: translateY(-70%) rotate(-45deg); }

/* 現の旅の帯 */
.band { position: absolute; left: 10px; right: 10px; bottom: 44px; border-radius: 14px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 0.92em; }
.band .w { font-family: var(--title-font); font-weight: 600; letter-spacing: 0.03em; }
.band .p { color: var(--ink-soft); font-size: 0.88em; }
.band.alert { border-color: var(--akane); }
.map-attr { position: absolute; right: 8px; bottom: 8px; font-size: 11px; padding: 2px 6px; border-radius: 6px; background: var(--surface); color: var(--ink-soft); border: 1px solid var(--line); }
.overlay-full { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; }

/* 帳 */
.book { background: var(--surface); border: 1px solid var(--line); border-radius: 6px 14px 14px 6px; box-shadow: inset 6px 0 0 var(--surface-3), var(--shadow); padding: 16px 14px 14px 20px; }
.book h3 { font-family: var(--title-font); font-weight: 600; margin: 0; font-size: 1.05em; letter-spacing: 0.05em; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font-size: 0.82em; margin-top: 10px; }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 16px; height: 16px; border-radius: 3px; flex: none; display: inline-block; }
.seg-in { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; margin-bottom: 12px; }
.seg-in button { flex: 1; border: 0; background: transparent; border-radius: 9px; min-height: 40px; cursor: pointer; font-size: 0.88em; color: var(--ink-soft); }
.seg-in button[aria-pressed="true"] { background: var(--ai-wash); color: var(--ai-text); font-weight: 700; }
.stamps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
.stamps .slot { aspect-ratio: 1; border-radius: 50%; border: 1.5px dashed var(--line-strong); display: grid; place-items: center; font-size: 0.7em; color: var(--ink-soft); text-align: center; line-height: 1.3; }
.stamps .slot svg { width: 100%; height: 100%; }
.thread { height: 6px; border-radius: 3px; background: var(--surface-3); position: relative; overflow: hidden; }
.thread i { position: absolute; inset: 0 auto 0 0; background: var(--ai); border-radius: 3px; }

/* 便り */
.letter { background: var(--paper); color: #2a2622; border: 1px solid rgba(42,38,34,0.22); border-radius: 4px 12px 12px 4px; padding: 14px 16px; font-family: var(--title-font); line-height: 1.9; box-shadow: 0 1px 0 rgba(42,38,34,0.05); }
.letter .from { font-family: var(--ui-font); font-size: 0.8em; color: rgba(42,38,34,0.70); }
.list-item { display: flex; gap: 12px; align-items: flex-start; }
.list-item .mark { flex: none; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); }
.unread { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--akane); margin-right: 6px; vertical-align: 2px; }

/* 支度 */
.settings { list-style: none; margin: 0; padding: 0; }
.settings li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); min-height: 52px; font-size: 0.93em; }
.settings li:last-child { border-bottom: 0; }
.settings .chev { color: var(--ink-soft); }
.settings .val { color: var(--ink-soft); font-size: 0.9em; text-align: right; }
.group-title { font-size: 0.78em; color: var(--ink-soft); letter-spacing: 0.08em; margin: 16px 2px 6px; }
.fs-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.fs-seg button { border: 0; background: transparent; min-height: 40px; min-width: 44px; cursor: pointer; }
.fs-seg button[aria-pressed="true"] { background: var(--ai); color: var(--ai-on); }

/* お礼の札 */
.credits { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(500px 360px at 70% 8%, #4a2230 0%, rgba(74,34,48,0) 60%), linear-gradient(180deg, #070b1d, #0f1633 60%, #1d2548); color: #e6e2ef; }
.credits .roll { position: absolute; left: 0; right: 0; top: 80px; text-align: center; padding: 0 24px 80px; animation: roll 40s linear 2s infinite; font-family: var(--title-font); }
.credits.paused .roll { animation-play-state: paused; }
@keyframes roll { from { transform: translateY(0); } to { transform: translateY(calc(-100% - 80px)); } }
.credits h4 { font-family: var(--ui-font); font-weight: 500; font-size: 0.78em; letter-spacing: 0.2em; color: #ffd89a; margin: 32px 0 8px; }
.credits p { margin: 4px 0; font-size: 1em; }
.credits .close { position: absolute; top: 12px; right: 12px; z-index: 2; }
.credits .head { position: absolute; top: 12px; left: 14px; z-index: 2; font-size: 0.8em; color: rgba(230,226,239,0.85); }

/* パートナー向け */
.admin { display: grid; grid-template-columns: 180px minmax(0,1fr); min-height: 100%; background: var(--surface-2); font-size: 0.9em; }
.admin aside { background: var(--surface); border-right: 1px solid var(--line); padding: 14px 10px; }
.admin aside .brand { font-family: var(--title-font); font-weight: 600; font-size: 0.95em; margin-bottom: 12px; line-height: 1.4; }
.admin aside button { display: block; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 8px 10px; min-height: 40px; cursor: pointer; color: var(--ink-soft); font-size: 0.92em; }
.admin aside button[aria-current="true"] { background: var(--ai-wash); color: var(--ai-text); font-weight: 700; }
.admin main { padding: 16px; min-width: 0; }
.admin h2 { font-family: var(--title-font); font-weight: 600; margin: 0 0 2px; font-size: 1.2em; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin: 12px 0; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.tile .k { font-size: 0.8em; color: var(--ink-soft); }
.tile .v { font-size: 1.6em; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }
.tile .d { font-size: 0.78em; color: var(--ink-soft); }
.chart-box { position: relative; }
.chart-box svg { width: 100%; height: auto; display: block; }
.chart-tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 4px 8px; font-size: 0.8em; box-shadow: var(--shadow); transform: translate(-50%, -110%); white-space: nowrap; display: none; }
.bar { fill: var(--ai); pointer-events: none; }
.bar-hit { fill: transparent; cursor: default; }
.bar-hit:hover + .bar, .bar.hl { fill: var(--ai-text); }
table.t { width: 100%; border-collapse: collapse; font-size: 0.88em; }
table.t th, table.t td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.t td.num { text-align: right; font-variant-numeric: tabular-nums; }
.check { list-style: none; padding: 0; margin: 6px 0 0; }
.check li { padding: 6px 0 6px 26px; position: relative; border-bottom: 1px solid var(--line); font-size: 0.92em; }
.check li::before { content: ""; position: absolute; left: 4px; top: 12px; width: 10px; height: 5px; border-left: 2px solid var(--ai-text); border-bottom: 2px solid var(--ai-text); transform: rotate(-45deg); }
.check li.no::before { border: 0; width: 12px; height: 2px; background: var(--akane); transform: none; top: 16px; }
.admin-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
.admin-grid + .card, .admin .card + .admin-grid { margin-top: 12px; }
.chart-box svg { max-height: 240px; }
@media (max-width: 760px) {
  .admin { grid-template-columns: minmax(0,1fr); }
  .admin aside { display: flex; flex-wrap: wrap; gap: 4px; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; }
  .admin aside .brand { width: 100%; margin: 0 0 4px; }
  .admin aside button { width: auto; flex: 1 1 auto; min-height: 36px; padding: 4px 8px; }
  .admin-grid { grid-template-columns: minmax(0,1fr); }
  .tiles { grid-template-columns: repeat(2, minmax(0,1fr)); }
}

.toast { position: absolute; left: 14px; right: 14px; bottom: 80px; z-index: 9; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px 10px 12px; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center; font-size: 0.9em; animation: rise .4s ease; }
.toast svg { flex: none; }
.dialog-wrap { position: absolute; inset: 0; z-index: 9; background: rgba(10,12,24,0.45); display: grid; place-items: center; padding: 20px; animation: fade .3s ease; }
.dialog { background: var(--surface); border-radius: 16px; padding: 18px; border: 1px solid var(--line); max-width: 320px; width: 100%; }
.dialog h3 { font-family: var(--title-font); margin: 0 0 6px; font-weight: 600; }

.title-name { font-family: var(--title-font); font-weight: 600; letter-spacing: 0.22em; text-align: center; margin: 0; line-height: 1.3; }


/* ===== ゲームらしい部品（10/17 の見直し） ===== */
/* 下のタブ: 和紙の帯に、墨の紋の絵のボタン。選んだものは琥珀の光と茜の細い線（朱の判子にはしない） */
.tabs { position: sticky; bottom: 0; z-index: 3; display: flex; justify-content: space-around; align-items: center; background: #efe4cc; border-top: 1px solid #c9a24a; padding: 4px 6px calc(6px + env(safe-area-inset-bottom)); box-shadow: 0 -6px 18px rgba(42,38,34,.08); }
.tabs button { width: 64px; height: 60px; min-height: 0; border: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; color: #2a2622; position: relative; font-family: var(--title-font); font-size: 12px; letter-spacing: .1em; }
.tabs .mon { width: 40px; height: 40px; display: block; color: #2a2622; position: relative; z-index: 1; }
.tabs button::before { content: ""; position: absolute; top: 2px; left: 50%; width: 52px; height: 52px; margin-left: -26px; border-radius: 50%; background: radial-gradient(circle, rgba(255,216,154,.95) 0%, rgba(255,154,72,.35) 55%, rgba(255,154,72,0) 72%); opacity: 0; transition: opacity .5s; }
.tabs button[aria-current="true"]::before { opacity: 1; }
.tabs button[aria-current="true"] { color: #b5523b; font-weight: 600; }
.tabs button[aria-current="true"] span.lb { box-shadow: inset 0 -2px 0 #b5523b; }
.tabs button .dot { position: absolute; top: 6px; left: calc(50% + 14px); width: 7px; height: 7px; border-radius: 50%; background: #b5523b; z-index: 2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tabs { background: #181e3c; border-top-color: rgba(201,162,74,.7); } :root:not([data-theme="light"]) .tabs button, :root:not([data-theme="light"]) .tabs .mon { color: #e6e2ef; } :root:not([data-theme="light"]) .tabs button[aria-current="true"] { color: #ffd89a; } :root:not([data-theme="light"]) .tabs button[aria-current="true"] span.lb { box-shadow: inset 0 -2px 0 #e3907e; } }
:root[data-theme="dark"] .tabs { background: #181e3c; border-top-color: rgba(201,162,74,.7); }
:root[data-theme="dark"] .tabs button, :root[data-theme="dark"] .tabs .mon { color: #e6e2ef; }
:root[data-theme="dark"] .tabs button[aria-current="true"] { color: #ffd89a; }
:root[data-theme="dark"] .tabs button[aria-current="true"] span.lb { box-shadow: inset 0 -2px 0 #e3907e; }

/* 支度: 箱庭をぼかした上に重ねる一時停止のメニュー */
.pause { position: absolute; inset: 0; overflow: hidden; }
.pause .under { position: absolute; inset: -12px; filter: blur(6px) brightness(.8); }
.pause .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,11,29,.25), rgba(7,11,29,.55)); }
.pause .menu { position: absolute; left: 0; right: 0; top: 70px; display: flex; flex-direction: row-reverse; justify-content: center; gap: 10px; padding: 0 16px; }
.pause .menu button { writing-mode: vertical-rl; min-width: 54px; min-height: 196px; padding: 16px 10px; border-radius: 4px; border: 1px solid rgba(201,162,74,.7); background: rgba(250,247,240,.92); color: #2a2622; font-family: var(--title-font); font-size: 20px; font-weight: 600; letter-spacing: .22em; cursor: pointer; box-shadow: 0 10px 26px rgba(0,0,0,.25); }
.pause .menu button[aria-pressed="true"] { background: #fff6dc; box-shadow: 0 0 0 2px #ffd89a, 0 0 32px rgba(255,154,72,.55); }
.pause .menu button.back-to { background: rgba(63,95,143,.95); color: #fff; border-color: rgba(255,216,154,.7); }
.pause .title { position: absolute; top: 16px; left: 0; right: 0; text-align: center; color: #fbf8f0; font-family: var(--title-font); font-size: 1.1em; letter-spacing: .4em; text-shadow: 0 0 12px rgba(7,11,29,.7); }
.pause .tier2 { position: absolute; left: 12px; right: 12px; bottom: 14px; max-height: 52%; overflow-y: auto; background: var(--surface); color: var(--ink); border-radius: 10px; border-top: 2px solid #c9a24a; padding: 12px 14px; box-shadow: 0 -8px 30px rgba(0,0,0,.25); animation: rise .45s ease; font-size: .92em; }
.pause .tier2 h3 { font-family: var(--title-font); font-weight: 600; font-size: 1.05em; margin: 0 0 6px; }
.pause .foot { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; color: rgba(251,248,240,.85); font-size: 11.5px; }
@media (max-width: 380px) { .pause .menu button { min-width: 48px; font-size: 18px; } }

/* 帳: 本の見開き */
.book-wrap { padding: 12px 10px 14px; }
.daisen { display: inline-block; font-family: var(--title-font); font-weight: 600; font-size: 1em; letter-spacing: .2em; padding: 4px 14px; background: #fbf8f0; color: #2a2622; border: 1px solid rgba(42,38,34,.3); border-radius: 2px; }
.spread { position: relative; display: grid; grid-template-columns: 1fr 1fr; margin-top: 10px; min-height: 520px; background: #fbf8f0; color: #2a2622; border-radius: 4px 4px 6px 6px; box-shadow: 0 1px 0 rgba(42,38,34,.15), 0 14px 34px rgba(42,38,34,.22), inset 0 0 0 1px rgba(42,38,34,.12); perspective: 1200px; }
.spread::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: rgba(42,38,34,.25); box-shadow: -10px 0 18px rgba(42,38,34,.07), 10px 0 18px rgba(42,38,34,.07); }
.spread .pg { padding: 14px 10px 12px 12px; min-width: 0; font-size: .86em; line-height: 1.6; --ink-line: #2a2622; --surface: #fbf8f0; --surface-2: #f3eee3; --line: rgba(42,38,34,.22); --line-strong: rgba(42,38,34,.38); --ink-soft: rgba(42,38,34,.7); --gold-line: #c9a24a; --ai: #3f5f8f; --rei-bg: #fff1d6; --rei-ink: #7a4a12; }
.spread .pg + .pg { padding: 14px 12px 12px 10px; }
.spread .pg.turn { animation: turn .6s ease; transform-origin: left center; }
@keyframes turn { from { transform: rotateY(-70deg); opacity: .2; } to { transform: none; opacity: 1; } }
.spread h3 { font-family: var(--title-font); font-weight: 600; font-size: 1.1em; margin: 0 0 6px; letter-spacing: .06em; }
.spread .tate-title { writing-mode: vertical-rl; font-family: var(--title-font); font-weight: 600; font-size: 1.35em; letter-spacing: .2em; height: 200px; margin: 0 auto 8px; }
.pg-no { position: absolute; bottom: 6px; font-size: 11px; color: rgba(42,38,34,.55); }
.turner { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; }
.turner button { min-height: 44px; min-width: 44px; border-radius: 22px; border: 1px solid var(--line-strong); background: var(--surface); padding: 0 14px; cursor: pointer; font-family: var(--title-font); }
.turner .where { font-size: .82em; color: var(--ink-soft); }
:root[data-theme="dark"] .spread { background: #e2d8c2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .spread { background: #e2d8c2; } }

/* 便り: 一通ずつ、折った手紙（縦書き。墨の〆と茜の細い帯。朱の判子にはしない） */
.letters { padding: 16px 14px 18px; }
.fumi, .fumi-pile { --ink-soft: rgba(42,38,34,.72); --line-strong: rgba(42,38,34,.38); --rei-bg: #fff1d6; --rei-ink: #7a4a12; --akane: #b5523b; }
.fumi { position: relative; margin: 6px auto 0; width: 100%; max-width: 340px; height: 390px; background: #fbf8f0; color: #2a2622; border-radius: 2px; box-shadow: 0 1px 0 rgba(42,38,34,.15), 0 14px 30px rgba(42,38,34,.2); padding: 22px 26px 18px 18px; overflow-x: auto; animation: rise .5s ease; }
.fumi::before { content: ""; position: absolute; top: 0; bottom: 0; right: 10px; width: 4px; background: #b5523b; opacity: .85; }
.fumi .shime { position: absolute; top: 10px; right: 18px; font-family: var(--title-font); font-size: 15px; color: #2a2622; }
.fumi .body { writing-mode: vertical-rl; font-family: var(--title-font); font-size: 1.05em; line-height: 2.1; letter-spacing: .12em; height: 100%; margin-right: 20px; }
.fumi .body .from { font-family: var(--ui-font); font-size: .78em; letter-spacing: .06em; color: rgba(42,38,34,.72); }
.fumi.yoko .body { writing-mode: horizontal-tb; height: auto; margin-right: 18px; }
.fumi.yoko { height: auto; }
.fumi-pile { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
.fumi-pile button { position: relative; width: 74px; min-height: 64px; border-radius: 2px; border: 1px solid rgba(42,38,34,.22); background: #f3ead6; color: #2a2622; cursor: pointer; font-family: var(--title-font); font-size: 12px; line-height: 1.35; padding: 6px 4px; box-shadow: 0 4px 10px rgba(42,38,34,.12); }
.fumi-pile button::after { content: ""; position: absolute; top: 0; bottom: 0; right: 5px; width: 3px; background: #b5523b; opacity: .7; }
.fumi-pile button[aria-pressed="true"] { background: #fff6dc; box-shadow: 0 0 0 2px #ffd89a, 0 4px 14px rgba(255,154,72,.4); }
:root[data-theme="dark"] .fumi, :root[data-theme="dark"] .fumi-pile button { background: #d9cfb8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fumi, :root:not([data-theme="light"]) .fumi-pile button { background: #d9cfb8; } }

/* 休み処の札: 画面の下に、低い木の板（吊るさない） */
.rest-board-wrap { position: absolute; inset: 0; z-index: 8; background: rgba(10,12,24,0.22); display: flex; align-items: flex-end; justify-content: center; animation: fade .4s ease; }
.rest-board { width: calc(100% - 24px); max-height: 42%; overflow-y: auto; margin-bottom: 12px; border-radius: 2px; padding: 12px 16px 10px; color: #2a2622; animation: rise .5s ease;
  background: repeating-linear-gradient(90deg, rgba(120,90,60,.05) 0 2px, rgba(0,0,0,0) 2px 9px), linear-gradient(#f3e9d4, #efe4cc 60%, #e6d8bb);
  box-shadow: inset 0 0 0 1px rgba(90,64,40,.35), 0 14px 34px rgba(0,0,0,.3); --ink-soft: rgba(42,38,34,.72); --line: rgba(42,38,34,.22); --line-strong: rgba(42,38,34,.38); --surface: #faf7f0; --ink: #2a2622; --rei-bg: #fff1d6; --rei-ink: #7a4a12; --ai-text: #3f5f8f; }
.rest-board h3 { font-family: var(--title-font); font-weight: 600; font-size: 1.25em; margin: 2px 0 2px; letter-spacing: .08em; }
.rest-board .row { display: flex; gap: 8px; margin-top: 8px; }
.rest-board .row .btn { min-height: 44px; flex: 1; font-size: .92em; background: rgba(250,247,240,.8); color: #2a2622; border-color: rgba(42,38,34,.3); }
.rest-board .assure { font-family: var(--title-font); font-size: 1em; margin: 6px 0 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .credits .roll { position: absolute; }
  .credits { overflow-y: auto; }
}

  if (q.get('ring') === '1') S.ring = true;
  if (q.get('table') === '1') S.pTable = true;

  render();
})();
})();
